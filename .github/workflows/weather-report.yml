name: Daily Weather Report - Qaem Shahr

on:
  schedule:
    - cron: '*/5 * * * *'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  weather-report:
    name: Fetch & Send Weather Report
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/weather-report.sh

      - name: Run weather report
        run: bash scripts/weather-report.sh